name: Bug Report / 问题反馈
description: 反馈在使用 LFH 过程中遇到的 Bug、报错或界面/组网异常
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: LFH 版本号 / Version
      description: 可在「设置 -> 版本升级」或启动日志中查看
      placeholder: V0.11.22.6
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境 / OS & Arch
      description: 包括单节点或主从集群各节点的系统与架构
      placeholder: Windows 11 amd64 / Ubuntu 22.04 amd64 / Docker
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: 部署模式 / Deployment Mode
      options:
        - 单节点独立运行 (Single Entry)
        - 多机主从集群 (Entry + Workers)
        - Docker 容器部署
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述与复现步骤 / Description & Steps
      description: 请描述遇到了什么异常，以及如何稳定触发该问题
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或截图 / Logs or Screenshots
      description: 可在「设置 -> 系统日志」一键导出运行日志后粘贴于此
      render: text
