name: Release QuailNest

on:
  push:
    tags:
      - 'V*'
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run tests
        run: go test -count=1 -v ./...

      - name: Build cross-platform binaries
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p release-assets
          TAG_VER="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X lfh/internal/version.Version=${TAG_VER}"

          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o release-assets/quailnest-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o release-assets/quailnest-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o release-assets/quailnest-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o release-assets/quailnest-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o release-assets/quailnest-darwin-arm64 .

          cd release-assets
          sha256sum quailnest-* > checksums.txt
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/quailnest-*
            release-assets/checksums.txt
