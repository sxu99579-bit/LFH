name: Release QuailNest

on:
  push:
    tags:
      - 'V*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. V1.11.25.2)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Run tests
        run: go test -count=1 ./...

      - name: Build cross-platform server binaries
        env:
          CGO_ENABLED: '0'
          TAG_VER: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p release-assets
          LDFLAGS="-s -w -X lfh/internal/version.Version=${TAG_VER}"

          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o release-assets/quailnest-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o release-assets/quailnest-linux-amd64 .
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o release-assets/quailnest-linux-arm64 .
          GOOS=darwin  GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o release-assets/quailnest-darwin-amd64 .
          GOOS=darwin  GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o release-assets/quailnest-darwin-arm64 .

      - name: Upload server binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-binaries
          path: release-assets/quailnest-*
          if-no-files-found: error

  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop

      - name: Test and build Windows desktop client
        shell: pwsh
        run: |
          Set-Location clients/desktop
          cargo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location ../..
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -Force clients/desktop/target/release/quailnest-desktop.exe release-assets/quailnest-desktop-windows-amd64.exe

      - name: Upload desktop binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-binary
          path: release-assets/quailnest-desktop-windows-amd64.exe
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure optional release keystore
        env:
          QN_KEYSTORE_BASE64: ${{ secrets.QN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$QN_KEYSTORE_BASE64" ]; then
            echo "$QN_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/quailnest-release.jks"
            echo "QN_KEYSTORE_PATH=$RUNNER_TEMP/quailnest-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build Android release APK
        env:
          QN_KEYSTORE_PASS: ${{ secrets.QN_KEYSTORE_PASS }}
          QN_KEY_ALIAS: ${{ secrets.QN_KEY_ALIAS }}
          QN_KEY_PASS: ${{ secrets.QN_KEY_PASS }}
        run: |
          cd clients/android
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ../..
          mkdir -p release-assets
          cp clients/android/app/build/outputs/apk/release/app-release.apk release-assets/quailnest-android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: release-assets/quailnest-android.apk
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-server, build-desktop, build-android]
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify artifacts and generate unified checksums
        run: |
          cd release-assets
          ls -lh
          COUNT=$(ls -1 quailnest-* | wc -l)
          if [ "$COUNT" -ne 7 ]; then
            echo "Expected 7 artifacts, found $COUNT" >&2
            exit 1
          fi
          LC_ALL=C sha256sum quailnest-* > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/quailnest-*
            release-assets/checksums.txt
