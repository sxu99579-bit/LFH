[package]
name = "quailnest-desktop"
version = "1.11.25"
edition = "2021"
description = "QuailNest Desktop Client (WebView2 / WRY)"

[dependencies]
tao = "0.37"
wry = "0.57"
muda = "0.21"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
